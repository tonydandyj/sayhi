<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f0e8" />
  <title>中国語入門 — 起きてから寝るまで</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;600&family=Playfair+Display:ital,wght@1,600&display=swap');
:root{--ink:#18332e;--muted:#68756f;--paper:#f4f0e8;--card:#fffdf8;--accent:#e9613a;--mint:#cdded3;--line:#d9d7ce;--shadow:0 18px 60px rgba(34,45,40,.10)}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans','Noto Sans JP',sans-serif;min-height:100vh}.grain{position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.08'/%3E%3C/svg%3E")}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(24,51,46,.12);padding:0 max(28px,calc((100vw - 1220px)/2));position:relative;z-index:1}.brand{color:var(--ink);text-decoration:none;font-weight:600;font-size:18px;display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--ink);border-radius:50%;font-family:'Playfair Display';font-style:italic}.header-actions{display:flex;gap:12px}.quiet-btn,.icon-btn{border:1px solid rgba(24,51,46,.18);background:transparent;color:var(--ink);border-radius:99px;padding:9px 16px;cursor:pointer}.icon-btn{width:38px;height:38px;padding:0;font-size:24px}.hero{max-width:1220px;margin:0 auto;padding:58px 24px 42px;display:flex;justify-content:space-between;align-items:end}.eyebrow,.mode-label,.select-label{font-size:11px;letter-spacing:.18em;font-weight:600;color:#708078}.hero h1{font-family:'Noto Sans JP';font-size:clamp(38px,5vw,67px);line-height:1.2;letter-spacing:-.06em;margin:13px 0 14px;font-weight:500}.hero h1 em{font-family:'Playfair Display','Noto Sans JP';color:var(--accent);font-weight:600}.lead{color:var(--muted);margin:0}.progress-orbit{width:120px;height:120px;position:relative}.progress-orbit svg{transform:rotate(-90deg)}.progress-orbit circle{fill:none;stroke-width:5}.orbit-bg{stroke:#ddd9cf}.orbit-fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transition:.5s}.progress-orbit>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.progress-orbit strong{font-size:29px}.progress-orbit span{font-size:10px;color:var(--muted)}.workspace{max-width:1220px;margin:0 auto;padding:0 24px 72px;display:grid;grid-template-columns:220px 1fr;gap:54px}.sidepanel{padding-top:8px}.mode-label{margin-bottom:12px}.set-option{width:100%;border:0;background:transparent;padding:12px 14px;display:flex;justify-content:space-between;border-radius:9px;color:var(--muted);cursor:pointer;font:inherit}.set-option.active{background:var(--ink);color:white}.set-option b{font-size:12px;background:rgba(255,255,255,.13);border-radius:20px;padding:3px 8px}.side-rule{border-top:1px solid var(--line);margin:23px 0}.select-label{display:block;margin-bottom:9px}select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:#faf8f2;color:var(--ink);font:inherit}.toggle-row{display:flex;justify-content:space-between;align-items:center;margin-top:17px;font-size:13px}.toggle-row input{display:none}.toggle-row i{width:38px;height:21px;border-radius:20px;background:#c6c9c4;position:relative;transition:.2s}.toggle-row i:after{content:'';position:absolute;width:15px;height:15px;border-radius:50%;background:white;top:3px;left:3px;transition:.2s}.toggle-row input:checked+i{background:var(--accent)}.toggle-row input:checked+i:after{transform:translateX(17px)}.shortcuts{font-size:11px;color:#89918c;line-height:2.3;margin-top:38px}.shortcuts span{border:1px solid #c9cbc5;border-radius:4px;padding:2px 5px;margin-right:5px}.study-area{max-width:780px}.study-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.study-head p{margin:0;font-size:14px;font-weight:600}.study-head small{color:#9a9f9b;margin:0 3px}.streak{font-size:12px;color:var(--muted)}.streak b{color:var(--accent);margin-left:4px}.card{min-height:390px;background:var(--card);border:1px solid rgba(24,51,46,.12);border-radius:20px;box-shadow:var(--shadow);padding:32px 38px 28px;display:flex;flex-direction:column;outline:none;position:relative;overflow:hidden}.card:before{content:'';position:absolute;width:190px;height:190px;border:1px solid rgba(24,51,46,.06);border-radius:50%;right:-92px;top:-92px}.card-top{display:flex;justify-content:space-between;color:#87908b;font-size:11px;text-transform:uppercase;letter-spacing:.16em}.speak{border:0;background:#eef1eb;color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer}.prompt-wrap{flex:1;display:grid;place-content:center;text-align:center;padding:26px 20px}.prompt{font-family:'Noto Sans JP';font-size:clamp(22px,3vw,32px);line-height:1.65;margin:0;white-space:pre-line}.hint{font-size:12px;color:#9a9f9b;margin:15px 0 0}.answer-area{display:none}.card.revealed .prompt-wrap{flex:0;padding:18px 18px 22px}.card.revealed .prompt{font-size:20px;color:#6a756f}.card.revealed .hint{display:none}.card.revealed .answer-area{display:block;flex:1;animation:rise .3s ease}.answer-rule{display:flex;align-items:center;gap:10px;color:#9a9f9b;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.answer-rule:after{content:'';height:1px;background:#e1dfd7;flex:1}.answer{font-size:clamp(20px,2.7vw,28px);line-height:1.6;margin:25px 8px;text-align:center;font-weight:500}.reveal{border:0;border-radius:10px;background:var(--ink);color:white;padding:15px 20px;font:inherit;font-weight:500;display:flex;justify-content:center;gap:18px;cursor:pointer}.reveal kbd{font:inherit;font-size:10px;border:1px solid rgba(255,255,255,.35);padding:2px 7px;border-radius:4px}.card.revealed .reveal{display:none}.ratings{margin-top:18px}.ratings>p{text-align:center;font-size:12px;color:var(--muted)}.ratings>div{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ratings button{border:1px solid var(--line);background:#faf8f2;border-radius:10px;padding:11px 8px;display:flex;gap:10px;align-items:center;text-align:left;color:var(--ink);cursor:pointer}.ratings button:hover{border-color:var(--accent);transform:translateY(-2px)}.ratings kbd{background:#e9e7df;border-radius:5px;padding:4px 7px}.ratings span{font-size:12px}.ratings small{display:block;color:#9a9f9b;margin-top:2px}.nav-row{display:flex;justify-content:space-between;margin-top:16px}.nav-row button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:8px}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:white;padding:10px 18px;border-radius:99px;font-size:13px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}dialog{width:min(720px,calc(100% - 32px));border:0;border-radius:18px;background:var(--card);box-shadow:0 30px 100px rgba(0,0,0,.25);padding:25px}dialog::backdrop{background:rgba(20,35,31,.45);backdrop-filter:blur(4px)}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0}.dialog-head button{border:0;background:none;font-size:25px;cursor:pointer}#searchInput{width:100%;padding:15px;margin:20px 0;border:1px solid var(--line);border-radius:10px;font:inherit}.results{max-height:55vh;overflow:auto}.result{padding:14px;border-bottom:1px solid #e6e3dc;cursor:pointer}.result:hover{background:#f4f0e8}.result b,.result span{display:block}.result span{color:var(--muted);font-size:13px;margin-top:5px}@keyframes rise{from{opacity:0;transform:translateY(7px)}}
.audio-actions{display:flex;align-items:center;gap:8px}.vi-speak{height:34px;border:1px solid #d6dfd8;background:#eef1eb;color:var(--ink);border-radius:99px;padding:0 13px;display:flex;align-items:center;gap:7px;font:600 11px 'DM Sans','Noto Sans JP',sans-serif;letter-spacing:0;cursor:pointer;text-transform:none}.vi-speak:hover{background:var(--ink);color:white}.play-icon{font-size:9px;color:var(--accent)}.vi-speak:hover .play-icon{color:#ff8a68}
.ratings .next-card-btn{position:fixed;right:28px;bottom:24px;z-index:30;width:auto;min-width:190px;margin:0;padding:14px 22px;background:var(--accent);color:#fff;border:0;box-shadow:0 10px 30px rgba(24,51,46,.28);justify-content:center;text-align:center;font-weight:700}
.hero-heading-row{display:flex;align-items:flex-end;gap:30px}.hero-heading-row h1{flex:none}.episode-title{margin:0 0 14px;color:var(--ink);font-size:clamp(38px,5vw,67px);line-height:1.2;font-weight:600;letter-spacing:-.04em;white-space:normal}
@media(max-width:760px){.topbar{height:64px;padding:0 18px}.quiet-btn{display:none}.hero{padding:38px 20px 28px;align-items:center}.hero h1{font-size:40px}.hero-heading-row{display:block}.episode-title{margin:-2px 0 10px;font-size:40px;white-space:normal}.lead{font-size:13px}.progress-orbit{width:90px;height:90px}.workspace{display:block;padding:0 14px 55px}.sidepanel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:18px}.mode-label,.side-rule,.select-label,.sidepanel select,.toggle-row,.shortcuts{display:none}.set-option{padding:10px 7px;font-size:11px;align-items:center}.study-area{max-width:none}.card{min-height:410px;padding:24px 20px 22px}.vi-speak span:last-child{display:none}.vi-speak{width:34px;padding:0;justify-content:center}.ratings>div{grid-template-columns:repeat(2,1fr)}.progress-orbit span{font-size:8px}}

.loop-start{border:0;background:var(--accent);color:white;border-radius:99px;padding:9px 15px;font:600 12px 'DM Sans','Noto Sans JP',sans-serif;cursor:pointer}
.loop-range{background:var(--ink)}
.loop-id{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:600}.loop-id input{width:58px;height:34px;border:1px solid rgba(24,51,46,.18);border-radius:9px;background:var(--card);color:var(--ink);padding:0 7px;font:600 13px 'DM Sans',sans-serif;text-align:center}
.loop-start span{font-size:16px;margin-right:4px}
.loop-controls{display:flex;gap:7px;padding:3px;background:#e7e3da;border-radius:99px}
.loop-controls button{border:0;background:transparent;color:var(--ink);border-radius:99px;padding:7px 11px;font:600 11px 'DM Sans','Noto Sans JP',sans-serif;cursor:pointer}
.loop-controls button:first-child{background:var(--card)}
.loop-controls[hidden],.loop-start[hidden]{display:none}
@media(max-width:760px){
  .loop-start{font-size:0;padding:0;width:38px;height:38px}
  .loop-id{font-size:0;gap:0}.loop-id input{width:48px;height:34px}
  .loop-start span{font-size:20px;margin:0}
  .loop-controls button{font-size:0;width:36px;height:32px;padding:0}
  .loop-controls button:first-child:before{content:'Ⅱ';font-size:13px}
  .loop-controls button:first-child.paused:before{content:'▶'}
  .loop-controls button:last-child:before{content:'■';font-size:11px}
}

@media (min-width:761px){
  body{height:100vh;overflow:hidden}
  .topbar{height:60px}
  .hero{padding:18px 24px 14px;align-items:center}
  .hero h1{font-size:38px;line-height:1.15;margin:7px 0 8px;letter-spacing:-.05em}
  .hero h1 br{display:none}
  .hero h1 em{margin-left:.18em}
  .hero-heading-row{gap:24px}
  .episode-title{margin:0 0 8px;font-size:38px}
  .lead{font-size:13px}
  .progress-orbit{width:82px;height:82px;margin-right:12px}
  .progress-orbit strong{font-size:23px}
  .progress-orbit span{font-size:8px}
  .workspace{padding:0 24px 14px;gap:34px;grid-template-columns:190px 1fr}
  .sidepanel{padding-top:2px}
  .set-option{padding:9px 12px}
  .side-rule{margin:14px 0}
  .toggle-row{margin-top:11px}
  .shortcuts{display:none}
  .study-area{max-width:900px}
  .study-head{margin-bottom:8px}
  .card{height:330px;min-height:0;padding:22px 30px 20px;border-radius:16px}
  .prompt-wrap{padding:14px 18px;overflow:auto;min-width:0}
  .prompt{font-size:clamp(20px,2.2vw,28px);line-height:1.5}
  .hint{margin-top:9px}
  .card.revealed .prompt-wrap{padding:8px 18px 12px;min-height:72px;flex-shrink:0;overflow:hidden}
  .card.revealed .prompt{font-size:17px}
  .prompt.japanese,.answer.japanese{width:100%;white-space:normal;overflow-wrap:anywhere;word-break:normal}
  .card.revealed .prompt.japanese{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;line-height:1.5;overflow:hidden}
  .answer-area{overflow:auto}
  .answer{font-size:clamp(18px,2vw,24px);line-height:1.45;margin:14px 8px}
  .reveal{padding:12px 18px}
  .ratings{margin-top:10px}
  .ratings>p{margin:0 0 6px}
  .ratings button{padding:8px}
  .ratings .next-card-btn{position:fixed;right:24px;bottom:20px;z-index:30;width:auto;min-width:180px;margin:0;padding:12px 18px;background:var(--accent);color:#fff;border:0;box-shadow:0 10px 30px rgba(24,51,46,.28);justify-content:center;text-align:center;font-weight:700}
  .nav-row{margin-top:6px}
}

    /* Chinese answer text: 200% of the original size */
  .answer:not(.japanese){font-size:clamp(30px,4.05vw,42px);line-height:1.4}
  @media(max-width:760px){.answer:not(.japanese){font-size:clamp(27px,6vw,36px);line-height:1.4}}
  
  .prompt:not(.japanese),.answer:not(.japanese),.result span,.brand{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif}
  .prompt:not(.japanese),.answer:not(.japanese){font-weight:500;letter-spacing:.035em}
  .pinyin{margin:-14px 8px 22px;text-align:center;color:var(--accent);font-family:'DM Sans',sans-serif;font-size:clamp(18px,2.4vw,26px);line-height:1.45;font-weight:500;letter-spacing:.01em}
  </style>
</head>
<body>
  <div class="grain"></div>
  <header class="topbar">
    <a class="brand" href="#" aria-label="ホーム"><span class="brand-mark">L</span><span>从起床到睡觉</span></a>
    <div class="header-actions">
      <label class="loop-id">開始ID <input id="loopStartId" type="number" min="1" value="1" inputmode="numeric" aria-label="ループ開始ID"></label>
      <label class="loop-id">終了ID <input id="loopEndId" type="number" min="1" value="130" inputmode="numeric" aria-label="ループ終了ID"></label>
      <button id="loopRangeBtn" class="loop-start loop-range"><span>↔</span> 区間ループ再生</button>
      <button id="loopAllBtn" class="loop-start"><span>↻</span> 全件ループ再生</button>
      <div id="loopControls" class="loop-controls" hidden>
        <button id="loopPauseBtn">Ⅱ 一時停止</button>
        <button id="loopStopBtn">■ 終了</button>
      </div>
      <button id="searchBtn" class="icon-btn" aria-label="検索"><span>⌕</span></button>
      <button id="resetBtn" class="quiet-btn">進捗をリセット</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">CHINESE DAILY ROUTINE</p>
        <div class="hero-heading-row">
          <h1><em>中国語入門：</em><br>起きてから寝るまで</h1>
          
        </div>
        <p class="lead">台詞を声に出して、思い出して、少しずつ定着させる。</p>
      </div>
      <div class="progress-orbit" aria-label="学習進捗">
        <svg viewBox="0 0 120 120"><circle class="orbit-bg" cx="60" cy="60" r="52"/><circle id="orbit" class="orbit-fg" cx="60" cy="60" r="52"/></svg>
        <div><strong id="masteredCount">0</strong><span>/ <i id="totalCount">0</i> 習得</span></div>
      </div>
    </section>

    <section class="workspace">
      <aside class="sidepanel">
        <div class="mode-label">学習セット</div>
        <button class="set-option active" data-filter="all"><span>すべて</span><b id="allCount">0</b></button>
        <button class="set-option" data-filter="due"><span>今日の復習</span><b id="dueCount">0</b></button>
        <button class="set-option" data-filter="hard"><span>苦手</span><b id="hardCount">0</b></button>
        <div class="side-rule"></div>
        <label class="select-label" for="direction">カードの向き</label>
        <select id="direction">
          <option value="ja-zh">日本語 → 中国語</option>
          <option value="zh-ja">中国語 → 日本語</option>
          <option value="random">ランダム</option>
        </select>
        <label class="toggle-row"><span>シャッフル</span><input id="shuffle" type="checkbox" checked><i></i></label>
        <label class="toggle-row"><span>苦手を優先</span><input id="priority" type="checkbox"><i></i></label>
        <div class="shortcuts"><span>SPACE</span> 答えを見る<br><span>1–4</span> 自己採点</div>
      </aside>

      <section class="study-area">
        <div class="study-head">
          <p><span id="currentIndex">1</span> <small>/</small> <span id="deckTotal">0</span></p>
          <div class="streak">連続学習 <b id="streak">0</b></div>
        </div>

        <article id="card" class="card" tabindex="0" aria-live="polite">
          <div class="card-top">
            <span id="promptLang">日本語</span>
            <div class="audio-actions">
              <button id="zhSpeakBtn" class="vi-speak" aria-label="中国語を再生"><span class="play-icon">▶</span><span>中国語を再生</span></button>
              <button id="speakBtn" class="speak" aria-label="表示文を読み上げ">♪</button>
            </div>
          </div>
          <div class="prompt-wrap"><p id="prompt" class="prompt"></p><p id="hint" class="hint">頭の中で中国語にしてみましょう</p></div>
          <div id="answerArea" class="answer-area">
            <div class="answer-rule"><span>答え</span></div>
            <p id="answer" class="answer"></p><p id="pinyin" class="pinyin" hidden></p>
          </div>
          <button id="revealBtn" class="reveal"><span>答えを見る</span><kbd>Space</kbd></button>
        </article>

        <div id="ratings" class="ratings" hidden>
          <p>思い出せましたか？</p>
          <div>
            <button data-score="1"><kbd>1</kbd><span>もう一度<small>すぐ復習</small></span></button>
            <button data-score="2"><kbd>2</kbd><span>難しい<small>1日後</small></span></button>
            <button data-score="3"><kbd>3</kbd><span>できた<small>3日後</small></span></button>
            <button data-score="4"><kbd>4</kbd><span>余裕<small>7日後</small></span></button>
          </div>
          <button id="nextBtn" class="next-card-btn">次のカードへ →</button>
        </div>
        <div class="nav-row"><button id="prevBtn">← 前へ</button><button id="skipBtn">スキップ →</button></div>
      </section>
    </section>
  </main>

  <dialog id="searchDialog">
    <form method="dialog" class="dialog-head"><h2>台詞を探す</h2><button aria-label="閉じる">×</button></form>
    <input id="searchInput" type="search" placeholder="中国語・ピンイン・日本語で検索…" autocomplete="off" />
    <div id="searchResults" class="results"></div>
  </dialog>

    loopResolve=finish;
    const src=window.CHINESE_AUDIO?.[card.id];
    if(src){activeAudio=new Audio(src);activeAudio.onended=finish;activeAudio.onerror=finish;activeAudio.play().catch(finish)}
    else{speakChineseProtected(card.zh,finish,finish)}
  });
}
const loopGap=(token,ms=450)=>new Promise(resolve=>setTimeout(()=>resolve(token===loopState.token),ms));
function showLoopCard(){
  $('#card').classList.add('revealed');
  $('#answerArea').style.display='block';
  $('#revealBtn').style.display='none';
  $('#ratings').hidden=true;
}
async function startLoop(mode='range'){
  if(loopState.running||!cards.length)return;
  if(mode==='all'){$('#loopStartId').value=1;$('#loopEndId').value=cards.length}
  let requestedStart=Math.trunc(Number($('#loopStartId').value))||1;
  let requestedEnd=Math.trunc(Number($('#loopEndId').value))||cards.length;
  requestedStart=Math.min(cards.length,Math.max(1,requestedStart));
  requestedEnd=Math.min(cards.length,Math.max(1,requestedEnd));
  if(requestedStart>requestedEnd)[requestedStart,requestedEnd]=[requestedEnd,requestedStart];
  const startIndex=requestedStart-1,endIndex=requestedEnd-1;
  $('#loopStartId').value=startIndex+1;
  $('#loopEndId').value=endIndex+1;
  $('#loopStartId').disabled=true;$('#loopEndId').disabled=true;
  loopState={running:true,paused:false,token:loopState.token+1,index:startIndex,startIndex,endIndex,mode};
  filter='all';$$('.set-option').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));
  $('#direction').value='ja-zh';deck=[...cards];pos=startIndex;
  $('#loopAllBtn').hidden=true;$('#loopRangeBtn').hidden=true;$('#loopControls').hidden=false;render();showLoopCard();
  const token=loopState.token;
  while(loopState.running&&token===loopState.token){
    const card=cards[loopState.index];pos=loopState.index;render();showLoopCard();
    await playChineseOnce(card,token);
    if(loopState.running&&token===loopState.token)await loopGap(token);
    if(loopState.running&&token===loopState.token)await playChineseOnce(card,token);
    if(!loopState.running||token!==loopState.token)break;
    loopState.index=loopState.index===loopState.endIndex?loopState.startIndex:loopState.index+1;
  }
}
function toggleLoopPause(){
  if(!loopState.running)return;loopState.paused=!loopState.paused;
  $('#loopPauseBtn').classList.toggle('paused',loopState.paused);
  if(loopState.paused){activeAudio?.pause();speechSynthesis.pause();$('#loopPauseBtn').textContent='▶ 再開'}
  else{if(activeAudio)activeAudio.play().catch(()=>{});speechSynthesis.resume();$('#loopPauseBtn').textContent='Ⅱ 一時停止'}
}
function stopLoop(){
  if(!loopState.running)return;loopState.running=false;loopState.paused=false;loopState.token++;
  stopAudio();if(loopResolve){loopResolve();loopResolve=null}
  $('#answerArea').style.display='';$('#loopStartId').disabled=false;$('#loopEndId').disabled=false;$('#loopPauseBtn').classList.remove('paused');$('#loopPauseBtn').textContent='Ⅱ 一時停止';$('#loopControls').hidden=true;$('#loopAllBtn').hidden=false;$('#loopRangeBtn').hidden=false;render();toast('ループ再生を終了しました');
}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1600)}
function results(q=''){const x=q.toLowerCase().trim(), matches=cards.filter(c=>!x||c.ja.toLowerCase().includes(x)||c.zh.toLowerCase().includes(x)||c.py.toLowerCase().includes(x));$('#searchResults').innerHTML=matches.map(c=>`<div class="result" data-id="${c.id}"><b>${c.ja}</b><span>${c.zh}<br><small>${c.py}</small></span></div>`).join('')||'<p>見つかりませんでした。</p>';$$('.result').forEach(el=>el.onclick=()=>{filter='all';$$('.set-option').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));buildDeck(+el.dataset.id);$('#searchDialog').close()})}
function bind(){
  $('#revealBtn').onclick=reveal;$('#card').ondblclick=reveal;$('#nextBtn').onclick=()=>next();$('#skipBtn').onclick=()=>next();$('#prevBtn').onclick=()=>next(-1);$('#speakBtn').onclick=e=>{e.stopPropagation();speak()};
  $('#zhSpeakBtn').onclick=e=>{e.stopPropagation();if(deck.length&&!loopState.running)playChinese(deck[pos],true)};
  $('#loopAllBtn').onclick=()=>startLoop('all');$('#loopRangeBtn').onclick=()=>startLoop('range');$('#loopPauseBtn').onclick=toggleLoopPause;$('#loopStopBtn').onclick=stopLoop;
  $$('.ratings button[data-score]').forEach(b=>b.onclick=()=>rate(+b.dataset.score));$$('.set-option').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('.set-option').forEach(x=>x.classList.toggle('active',x===b));buildDeck()});
  ['direction','shuffle','priority'].forEach(id=>$('#'+id).onchange=()=>buildDeck());
  $('#searchBtn').onclick=()=>{results();$('#searchDialog').showModal();setTimeout(()=>$('#searchInput').focus(),50)};$('#searchInput').oninput=e=>results(e.target.value);
  $('#resetBtn').onclick=()=>{if(confirm('学習進捗をすべてリセットしますか？')){Object.keys(state).forEach(k=>delete state[k]);save();updateStats();buildDeck();toast('進捗をリセットしました')}};
  document.onkeydown=e=>{if($('#searchDialog').open)return;if(e.code==='Space'||e.key==='ArrowDown'){e.preventDefault();reveal()}if(['1','2','3','4'].includes(e.key))rate(+e.key);if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')next(-1)};
}
init().catch(()=>{$('#prompt').textContent='データを読み込めませんでした';$('#hint').textContent='ローカルサーバーから開いてください'});

  </script>
</body>
